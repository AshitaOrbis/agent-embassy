# Agent Embassy - Agent Metadata
# This file is mounted for the agent to read. It is not consumed by Docker Compose
# and does not configure egress, resources, or output validation.
#
# Operative controls live in:
# - .env: agent image, command, and resource limits
# - config/squid.conf: egress destination allowlist
# - config/validation-rules.json: observational output checks

agent:
  name: my-agent
  description: "A containerized AI agent"
