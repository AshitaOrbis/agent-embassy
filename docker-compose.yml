services:
  agent:
    image: ${AGENT_IMAGE:?Set AGENT_IMAGE in .env to an image containing your agent}
    container_name: embassy-agent
    restart: unless-stopped
    init: true

    # SECURITY: Run as non-root user
    user: "1000:1000"

    # SECURITY: Read-only rootfs with tmpfs for writable paths
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777,uid=1000,gid=1000
      - /run:size=50M,mode=755,uid=1000,gid=1000

    # SECURITY: Drop ALL capabilities, no privilege escalation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Volumes: inbox is read-only; outbox/logs/state are read/WRITE host bind
    # mounts, not one-way channels — the agent can read and modify anything in
    # them, including files the host or validator has already seen.
    volumes:
      - ./inbox:/app/inbox:ro          # Tasks from host (read-only)
      - ./outbox:/app/outbox:rw        # Results from agent (read/write; observed by validator)
      # Agent-writable log storage, NOT an audit trail: only the agent writes
      # here, so it can omit, forge, or delete every entry. Squid's own logs
      # live in a tmpfs and vanish with the container.
      - ./logs:/app/logs:rw
      - ./agent-state:/app/state:rw    # Persistent agent state
      - ./config/agent.yml:/app/config/agent.yml:ro  # Agent definition

    # Required: the selected image must already contain this entrypoint
    command: ${AGENT_COMMAND:?Set AGENT_COMMAND in .env to an entrypoint present in AGENT_IMAGE}

    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      # Proxy all traffic through egress filter
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      - NO_PROXY=localhost,127.0.0.1

    # SECURITY: Resource limits
    mem_limit: ${AGENT_MEM_LIMIT:-2G}
    cpus: ${AGENT_CPUS:-2}
    pids_limit: ${AGENT_PIDS_LIMIT:-100}

    networks:
      - embassy-internal

    depends_on:
      - egress-proxy

  # SECURITY: Egress proxy (allowlist-only internet access)
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: embassy-egress
    read_only: true
    tmpfs:
      - /var/spool/squid:size=100M,uid=13,gid=13
      - /var/log/squid:size=50M,uid=13,gid=13
      - /run:size=10M,mode=755
    volumes:
      - ./config/squid.conf:/etc/squid/squid.conf:ro
    networks:
      embassy-internal:
      embassy-external:
    mem_limit: 256M
    cpus: 0.5

  # Host-side output validator
  validator:
    image: python:3.12-slim
    container_name: embassy-validator
    read_only: true
    tmpfs:
      - /tmp:size=50M,mode=1777
    volumes:
      - ./outbox:/app/outbox:rw
      - ./scripts/validate_outbox.py:/app/validate.py:ro
      - ./config/validation-rules.json:/app/rules.json:ro
    command: python /app/validate.py --watch /app/outbox --rules /app/rules.json
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128M
    cpus: 0.25
    # No network: the validator only touches the outbox bind mount. NB an empty
    # `networks: []` would NOT disable networking — the Compose spec attaches
    # such a service to the implicit default bridge. network_mode "none" is the
    # setting that actually disables it.
    network_mode: "none"

networks:
  embassy-internal:
    driver: bridge
    internal: true   # No direct internet - all traffic through egress proxy
  embassy-external:
    driver: bridge   # Egress proxy's outbound access
